# DishNet Uganda — static site.
#
# Adapted from dishnet-web/nginx.conf (the Sudan site). dishnetuganda.com is a
# fresh domain with no legacy URLs, so the Netlify-redirect block is omitted;
# everything else — compression, headers, caching, the real 404 — is the same
# hardened configuration that verify-site.sh proved out for Sudan.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Slow connections are the design constraint. Compress everything textual.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/rss+xml font/woff font/woff2;

    # Traefik terminates TLS in front, so send the client's real address on.
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;

    # Emit relative Location headers, so the browser keeps the scheme, host and
    # port it actually used. Left on, nginx builds an absolute URL from what IT
    # sees — plain http on 80 behind Traefik — and every redirect points
    # somewhere unreachable. Found the hard way on the Sudan site.
    absolute_redirect off;

    add_header X-Content-Type-Options  "nosniff"            always;
    add_header X-Frame-Options         "SAMEORIGIN"         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Nothing hidden, nothing listed. autoindex is off by default in nginx,
    # but a hardening property this load-bearing should not rest on a default.
    autoindex off;
    location ~ /\. { deny all; }

    # Long cache for things whose content is fixed; short for pages, so a
    # content fix reaches people the same day. `expires` sets Cache-Control by
    # itself — adding our own as well emits two competing headers and, because
    # nginx drops every inherited add_header the moment a block declares one of
    # its own, silently strips the security headers (see the Sudan config).
    expires 10m;

    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }

    # The APK, when one is dropped in. Without the MIME type Android refuses it.
    location ~* \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
        # Repeated, not redundant: the add_header above cancels inheritance.
        add_header X-Content-Type-Options "nosniff"    always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Extensionless URLs resolve to .html. Unknown paths are a REAL 404 with
    # the branded page — never a masked 200 homepage.
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
