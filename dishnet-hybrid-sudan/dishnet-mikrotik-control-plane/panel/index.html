<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DishNet Admin</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#15181d; --muted:#6b7280; --line:#e3e6ea;
  --green:#128a4b; --amber:#b26a00; --red:#c02626; --gray:#9aa1aa; --accent:#1f4fd8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     -webkit-text-size-adjust:100%}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#11151b;color:#cdd3da;padding:14px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 16px 14px;font-weight:700;color:#fff;letter-spacing:.2px}
.navsec{padding:14px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6f7a87}
.navitem{display:block;padding:9px 16px;color:#cdd3da;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
.navitem:hover{background:#1a212a;color:#fff}
.navitem.on{background:#1a212a;color:#fff;border-left-color:var(--accent)}
main{min-width:0;padding:0 0 40px}
.appbar{padding:18px 20px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.appbar h1{margin:0;font-size:20px}
.appbar .sub{color:var(--muted);font-weight:400;font-size:13px}
.evidence{margin:0 20px;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;
          flex-wrap:wrap;font-size:12.5px;border:1px solid var(--line);background:#fff}
.evidence b{letter-spacing:.06em;font-size:11px;padding:2px 7px;border-radius:5px;background:#eef1f5}
.evidence.simulated{border-color:#f0c36b;background:#fff8e8}
.evidence.simulated b{background:#f0c36b;color:#3b2a00}
.evidence.production{border-color:#a9d8b8;background:#f0fbf4}
.evidence.production b{background:var(--green);color:#fff}
.cohorts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 4px}
.fl{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;cursor:pointer;font:inherit;color:inherit}
.fl i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--gray)}
.fl.fresh i{background:var(--green)} .fl.warm i{background:var(--amber)}
.fl.cold i{background:var(--red)} .fl.never i{background:var(--gray);opacity:.6}
.fl .fl-n{font-weight:700} .fl .fl-l{color:var(--muted);text-transform:capitalize}
.fl.zero{opacity:.55} .fl.on{background:#11151b;color:#fff;border-color:#11151b}
.fl.on .fl-l{color:#c9d0d8}
.searchbar{padding:10px 20px 6px}
.searchbar input{width:100%;max-width:460px;padding:9px 12px;border:1px solid var(--line);
                 border-radius:8px;font:inherit;background:#fff}
.tw{margin:10px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafbfc}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-router]{cursor:pointer}
tbody tr[data-router]:hover{background:#f4f7ff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef1f5;font-size:12px}
.pill.failed{background:#fde8e8;color:var(--red)}
.hs{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hs i{width:7px;height:7px;border-radius:50%;flex:none}
.hs.fresh i{background:var(--green)} .hs.fresh{color:var(--green)}
.hs.warm i{background:var(--amber)} .hs.warm{color:var(--amber)}
.hs.cold i{background:var(--red)} .hs.cold{color:var(--red)}
.hs.never i{background:var(--gray);opacity:.6} .hs.never{color:var(--muted)}
.stateblock{margin:14px 20px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
h2.sub{margin:22px 20px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* Provisioning ladder. A rung not yet reached is hollow, never red: not having
   got there is not a fault. */
.ladder{list-style:none;margin:8px 20px;padding:12px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;display:flex;flex-wrap:wrap;gap:6px 22px}
.ladder li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ladder .dot{width:9px;height:9px;border-radius:50%;flex:none;border:2px solid var(--gray);background:transparent}
.ladder li.done .dot{background:var(--green);border-color:var(--green)}
.ladder li.done .step{color:var(--ink)}
.ladder li.here .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px #1f4fd822}
.ladder li.here .step{color:var(--ink);font-weight:700}
.ladder .when{font-size:11.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* Signals. Measured is green; unmeasured is GREY and says so in words — never
   red, because red would claim a fault was observed and nothing observed one. */
.signals{margin:8px 20px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.signal{display:flex;gap:10px;padding:12px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
.signal .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--gray)}
.signal.measured .dot{background:var(--green)}
.signal.unmeasured{background:#fbfbfc}
.signal.unmeasured .dot{background:transparent;border:2px solid var(--gray);width:7px;height:7px}
.signal b{font-size:13.5px}
.signal .verdict{margin-left:7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.signal.measured .verdict{color:var(--green)}
.signal p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
.signal p.needs{color:#4b5563;font-style:italic}
.signal p.src{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#7a828c}
.signal.unexposed{background:#fbfaf6}
.signal.unexposed .dot{background:var(--amber)}
.signal.unexposed .verdict{color:var(--amber)}
.opgrid{margin:8px 20px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.op{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.op h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.op p{margin:0;font-size:16px}
.op b{font-size:22px}
.op small{display:block;margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.4}
.muted{color:var(--muted);font-size:14px}
.signals.tight{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.signals.tight .signal{padding:10px 12px}
.hint{margin:6px 20px 0;font-size:12.5px;color:var(--muted)}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline}
.hscard{margin:10px 20px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.hscard h3{margin:0 0 10px;font-size:15px}
.hscard h4{margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hscard .tw{margin:0}
.hsrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.hsrow dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hsrow dd{margin:3px 0 0}
.hsrow small{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.vcount{display:flex;flex-wrap:wrap;gap:8px}
.vc{padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted)}
.vc b{color:var(--ink);font-size:15px;margin-right:4px}
.vc.total{background:#11151b;color:#c9d0d8;border-color:#11151b}
.vc.total b{color:#fff}
.lifecycle{margin:8px 20px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.lc{display:flex;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.lc .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--green)}
.lc.unreachable{background:#fbfbfc}
.lc.unreachable .dot{background:transparent;border:2px solid var(--gray);width:7px;height:7px}
.lc b{font-size:13.5px;text-transform:capitalize}
.lc .verdict{margin-left:7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lc.reachable .verdict{color:var(--green)}
.lc p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}

/* Actions. Unavailable ones are shown inert so DishNet staff can see what the
   product will do and why it cannot yet; the one the server marks available
   (push configuration, a job for the worker) is live on a router's own page. */
.actions{margin:8px 20px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.action{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.action.live{border-color:#b9c8f2}
.action p{margin:7px 0 0;font-size:12.5px;color:var(--muted)}
.btn.live{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Lifecycle: the next step a person may record, from the current state. */
.steps{margin:8px 20px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.steps-head{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.steps .btn{margin:2px 6px 2px 0}
.sform select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.btn{font:inherit;padding:7px 13px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed;background:#f3f4f6;color:var(--muted)}
.stateblock h3{margin:0 0 6px;font-size:15px}
.stateblock p{margin:0;color:var(--muted);max-width:62ch}
.stateblock.unauthorized,.stateblock.forbidden{border-color:#f0c36b;background:#fff8e8}
.stateblock.offline,.stateblock.failed{border-color:#e9b0b0;background:#fdf3f3}
.kv{margin:12px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0}
.kv>div{padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.kv dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.note{margin:12px 20px;padding:11px 14px;border-left:3px solid var(--accent);background:#fff;
      color:var(--muted);border-radius:0 8px 8px 0;max-width:72ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px 20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{color:var(--muted);font-size:12.5px}
.tile.bad{border-color:#e9b0b0;background:#fdf3f3} .tile.warn{border-color:#f0c36b;background:#fff8e8}
.burger{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;display:flex;gap:2px;overflow-x:auto;padding:8px;
        scrollbar-width:none}
  aside::-webkit-scrollbar{display:none}
  .brand{display:none}
  .navsec{display:none}
  .navitem{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:8px 12px;border-radius:6px}
  .navitem.on{border-left:0;border-bottom-color:var(--accent)}
  .appbar,.evidence,.cohorts,.searchbar,.tw,.stateblock,.kv,.note,.tiles{margin-left:0;margin-right:0}
  .appbar,.cohorts,.searchbar{padding-left:14px;padding-right:14px}
  .evidence,.tw,.stateblock,.kv,.note,.tiles{margin-left:14px;margin-right:14px}
}
@media (max-width:420px){
  .appbar h1{font-size:18px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  th,td{padding:9px 10px}
}
/* ── the login gate ───────────────────────────────────────────────────── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lg{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:28px 30px;max-width:520px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.lg h1{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lg h2{margin:6px 0 4px;font-size:23px}
.lg p{margin:8px 0;color:var(--muted)}
.lg .lg-sub{margin-top:0}
.lg .lg-label{color:var(--ink);font-weight:600;margin-top:18px}
.lg-roles{display:flex;gap:8px;flex-wrap:wrap}
.lg-btn{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;
        border-radius:8px;padding:9px 16px;text-transform:capitalize}
.lg-btn:hover{filter:brightness(1.08)}
.lg-stop .lg-btn{background:#11151b}
.lg-dev{border:1px solid #f0c36b;background:#fff8e8;color:#3b2a00;border-radius:8px;padding:10px 12px;font-size:12.5px}
.lg-dev b{letter-spacing:.06em}
.lg-stop{border-color:#e6b4b4}
.lg-meta{font-size:12.5px}
.lg-busy .lg-spin{color:var(--ink);font-weight:600}
.lg-form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lg-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.lg-form input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.lg-form .lg-btn{align-self:flex-start;text-transform:none}
.lg-key{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;padding:12px 14px;
        background:#f6f7f9;border:1px solid var(--line);border-radius:8px;font-size:13px}
.lg-key span{color:var(--muted)} .lg-key b.small{font-size:11.5px;overflow-wrap:anywhere;font-weight:400}
.lg-err{color:var(--red)}
@media (max-width:520px){ .lg{padding:22px 18px} }
/* ── identity plane: who is signed in, the roster, the account ─────────── */
.who{margin:14px 16px 0;padding-top:12px;border-top:1px solid #232a33;font-size:12.5px;color:#9aa1aa}
.who b{color:#fff;display:block} .who .lnk{display:inline-block;margin-top:6px;color:#cdd3da}
.sform{margin:12px 20px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
       display:flex;flex-direction:column;gap:9px;max-width:560px}
.sform h3{margin:0 0 2px;font-size:14px}
.sform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.sform input[type=text],.sform input:not([type]),.sform input[type=password]{font:inherit;padding:8px 10px;
       border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.sform .btn{align-self:flex-start} .sform small{color:var(--muted)}
.radios{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink)} .radios label{flex-direction:row;align-items:center;gap:4px}
.btn.small{padding:4px 9px;font-size:12px} .btn.ghost{background:transparent;color:var(--muted)}
.acts{white-space:normal;min-width:320px} .acts .btn{margin:2px 4px 2px 0} .rolechange{display:inline-block}
.once{margin:12px 20px;padding:12px 14px;border:2px solid var(--amber);background:#fff8e8;border-radius:10px;max-width:560px}
.once code{display:block;margin-top:8px;font-size:16px;letter-spacing:.04em;user-select:all}
.once p{margin:6px 0 0;color:var(--muted)}
.msg{margin:12px 20px;padding:10px 14px;border-radius:8px;max-width:560px}
.msg.ok{background:#f0fbf4;border:1px solid #a9d8b8} .msg.err{background:#fdf3f3;border:1px solid #e9b0b0;color:var(--red)}
@media (max-width:860px){ .who{display:none} .sform,.once,.msg{margin-left:14px;margin-right:14px} }
</style>
</head><body>
<div id="gate" hidden></div>
<div class="shell" hidden>
  <aside><div class="brand">DishNet Admin</div><nav id="nav"></nav><div id="who" class="who"></div></aside>
  <main>
    <div id="evidence"></div>
    <div id="main"></div>
  </main>
</div>
<script type="module">
  import { boot } from './app.js';
  boot();
</script>
</body></html>
