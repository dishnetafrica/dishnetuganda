</script>
<script>
/* ---- OVERVIEW: Fleet / Operations / Business, clearly separated ---- */
function vDashboard(){
  const n=k=>ROUTERS.filter((COHORTS.find(c=>c.k===k)||{f:()=>0}).f).length;
  const pend=INTENTS.filter(i=>['queued','running'].includes(i.state)).length;
  const fail=INTENTS.filter(i=>i.state==='failed').length;
  const wait=INTENTS.filter(i=>i.state==='waiting').length;
  const rev=SALES.reduce((a,s)=>a+s.amount,0);
  const avail=BATCHES.reduce((a,b)=>a+b.unused,0);
  const attn=[];
  ROUTERS.filter(r=>r.conn==='offline').forEach(r=>attn.push({s:'var(--red)',t:r.name+' offline',
    w:'Guests at '+custOfRouter(r).name+' cannot connect · last seen '+agoTxt(r.seen),a:'View router',f:`go('router','${r.id}')`}));
  ROUTERS.filter(r=>r.conn==='never').forEach(r=>attn.push({s:'var(--dark)',t:r.name+' has never connected',
    w:'Registered but never reached the gateway — installation issue',a:'View router',f:`go('router','${r.id}')`}));
  INTENTS.filter(i=>i.state==='failed').forEach(i=>attn.push({s:'var(--red)',t:'Provisioning failed — '+routerById(i.router).name,
    w:i.err,a:'Open intent',f:"go('intents')"}));
  ROUTERS.filter(r=>r.prov==='drift').forEach(r=>attn.push({s:'var(--amber)',t:r.name+' has config drift',
    w:driftCount(r)+' setting(s) differ from desired state',a:'Reconcile',f:`go('router','${r.id}','prov')`}));
  BATCHES.filter(b=>b.unused/b.qty<0.12).forEach(b=>attn.push({s:'var(--amber)',t:'Batch '+b.id+' nearly sold out',
    w:b.unused+' of '+b.qty+' left · '+planName(b.plan),a:'Generate more',f:'modalGenerate()'}));
  const band=(title,note,tiles)=>`<div class="card mt16"><div class="card-h"><h3>${title}</h3><span class="sub">${note}</span></div>
    <div class="card-b"><div class="stats">${tiles}</div></div></div>`;
  const tile=(l,v,d,f,col)=>`<div class="stat ${f?'link':''}" ${f?`onclick="${f}"`:''}><div class="lbl">${l}</div>
    <div class="val" ${col?`style="color:${col}"`:''}>${v}</div><div class="delta muted">${d||''}</div></div>`;
  return `
  <div class="card attn no-print"><div class="card-h"><h3>Needs attention</h3><span class="pill p-bad">${attn.length}</span>
    <div class="grow"></div><button class="btn btn-sm" onclick="go('routers')">Go to routers</button></div>
    ${attn.length?attn.map(a=>`<div class="attn-row"><i class="sev" style="background:${a.s}"></i>
      <div class="grow"><div style="font-weight:600">${esc(a.t)}</div><div class="why">${esc(a.w)}</div></div>
      <button class="btn btn-sm" onclick="${a.f}">${a.a}</button></div>`).join('')
    :`<div class="allgood"><b>Everything is running.</b><br><span class="tiny">${n('online')} routers online · ${SESSIONS.length} guests connected</span></div>`}
  </div>
  ${band('Fleet','state of the MikroTik estate',
    tile('Total routers',ROUTERS.length,'','go(\'routers\')')+
    tile('Online',n('online'),'','rF.cohort=\'online\';go(\'routers\')')+
    tile('Offline',n('offline'),'',"rF.cohort='offline';go('routers')",n('offline')?'var(--danger-text)':'')+
    tile('Never connected',n('never'),'registered, not yet seen',"rF.cohort='never';go('routers')")+
    tile('Provisioning',n('prov'),'',"rF.cohort='prov';go('routers')")+
    tile('Config drift',n('drift'),'',"rF.cohort='drift';go('routers')",n('drift')?'var(--amber-dark)':'')+
    tile('Failed',n('failed'),'',"rF.cohort='failed';go('routers')",n('failed')?'var(--danger-text)':''))}
  ${band('Operations','queued work and its delivery state',
    tile('Pending intents',pend,'queued or sent',"go('intents')")+
    tile('Failed intents',fail,'',"iFilter='failed';go('intents')",fail?'var(--danger-text)':'')+
    tile('Waiting for router',wait,'held until next check-in',"iFilter='waiting';go('intents')",wait?'var(--amber-dark)':''))}
  ${band('Business','today',
    tile("Today's revenue",UGX(rev),'&#9650; 12%',"go('sales')")+
    tile('Vouchers sold',SALES.length,'across '+new Set(SALES.map(s=>s.agent)).size+' counters',"go('sales')")+
    tile('Active sessions',SESSIONS.length,'&#9650; 18 vs yesterday',"go('sessions')")+
    tile('Vouchers available',avail,BATCHES.filter(b=>b.unused/b.qty<0.12).length+' batch(es) low',"go('batches')"))}
  <div class="card mt16"><div class="card-h"><h3>Sales by counter</h3><div class="grow"></div>
      <button class="btn btn-sm btn-ghost" onclick="go('sales')">All sales</button></div><div class="card-b">
    ${[...new Set(SALES.map(s=>s.agent))].map(a=>{const rows=SALES.filter(s=>s.agent===a),amt=rows.reduce((x,s)=>x+s.amount,0);
      return `<div class="spread" style="padding:5px 0"><span style="width:180px" class="tiny">${esc(a)}</span>
      <div class="grow" style="background:var(--gray-light);height:7px;border-radius:4px"><div style="width:${Math.round(amt/rev*100)}%;background:var(--red);height:7px;border-radius:4px"></div></div>
      <b style="width:92px;text-align:right">${UGX(amt)}</b><span class="tiny muted" style="width:52px;text-align:right">${rows.length} sold</span></div>`;}).join('')}
  </div></div>`;
}

/* ---- PLANS: + devices per voucher, + elapsed/paused ---- */
const MODE_TXT={elapsed:'Clock runs from activation. A 1 Day plan expires 24 h after first use, connected or not.',
                paused:'Clock only runs while connected. A 1 Day plan gives 24 h of actual connected time.'};
function vPlans(){
  return `<div class="card"><div class="card-h"><h3>Plans</h3><span class="sub">what a guest buys</span><div class="grow"></div>
      <button class="btn btn-primary btn-sm" onclick="modalPlan()">+ New plan</button></div>
    <div class="t-wrap"><table><thead><tr><th>Plan</th><th class="right">Price</th><th>Validity</th><th>Time mode</th>
      <th class="right">Devices</th><th>Speed</th><th>Data</th><th class="right">Users</th><th class="right">Revenue (30d)</th><th>Status</th><th></th></tr></thead><tbody>
      ${PLANS.map(p=>`<tr class="clickable" onclick="modalPlan('${p.id}')">
        <td class="t-name">${esc(p.name)}</td><td class="right"><b>${UGX(p.price)}</b></td><td>${esc(p.validity)}</td>
        <td><span class="pill ${p.mode==='paused'?'p-info':'p-mute'}"><i class="dot"></i>${p.mode==='paused'?'Paused time':'Elapsed time'}</span></td>
        <td class="right">${p.devices>=99?'Unlimited':p.devices+' device'+(p.devices>1?'s':'')}</td>
        <td class="mono t-sub">${p.down}/${p.up} Mbps</td><td>${p.data||'<span class="muted">Unlimited</span>'}</td>
        <td class="right">${p.users||'—'}</td><td class="right">${UGX(p.revenue)}</td>
        <td><span class="pill ${p.status==='active'?'p-ok':'p-mute'}"><i class="dot"></i>${p.status}</span></td>
        <td><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();modalPlan('${p.id}')">Edit</button></td>
      </tr>`).join('')}</tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--line2)">
      ${gate('Speed, data cap, device count and paused-time behaviour all need <b>Step 0</b> to confirm the router honours them. Phase 0 proved only <span class="mono">Mikrotik-Rate-Limit</span>, <span class="mono">Session-Timeout</span> and <span class="mono">Acct-Interim-Interval</span>.')}</div></div>`;
}
let planMode='elapsed';
function modalPlan(id){
  const p=PLANS.find(x=>x.id===id)||{name:'',price:'',validity:'',down:10,up:3,data:'',devices:1,mode:'elapsed',status:'active'};
  planMode=p.mode;
  openModal(`<div class="modal-h"><h3>${id?'Edit plan':'New plan'}</h3><div class="grow"></div>
      ${id?`<button class="btn btn-sm btn-ghost" onclick="retirePlan('${id}')">Retire</button>`:''}
      <button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
  <div class="modal-b">
    <div class="field"><label>Plan name</label><input id="pn" value="${esc(p.name)}" placeholder="1 Day"></div>
    <div class="f2"><div class="field"><label>Price (UGX)</label><input id="pp" type="number" value="${p.price}" placeholder="5000"></div>
      <div class="field"><label>Validity</label><input id="pv" value="${esc(p.validity)}" placeholder="24 hours"></div></div>
    <div class="field"><label>Time behaviour</label>
      <div class="segbar"><button id="m-elapsed" class="${p.mode==='elapsed'?'on':''}" onclick="setMode('elapsed')">Elapsed time</button>
        <button id="m-paused" class="${p.mode==='paused'?'on':''}" onclick="setMode('paused')">Paused time</button></div>
      <div class="modehint" id="modehint">${MODE_TXT[p.mode]}</div></div>
    <div class="field"><label>Devices per voucher</label>
      <select id="pdev">${[1,2,3,4,5,10,99].map(d=>`<option value="${d}" ${p.devices===d?'selected':''}>${d>=99?'Unlimited':d+' device'+(d>1?'s':'')}</option>`).join('')}</select>
      <div class="hint">How many devices one voucher may authenticate at the same time.</div></div>
    <div class="f3"><div class="field"><label>Download (Mbps)</label><input id="pd" type="number" value="${p.down}"></div>
      <div class="field"><label>Upload (Mbps)</label><input id="pu" type="number" value="${p.up}"></div>
      <div class="field"><label>Data cap</label><input id="pc" value="${esc(p.data||'')}" placeholder="unlimited"></div></div>
    ${gate('Enforcement of device count and paused time is <b>pending technical validation</b> on real hardware.')}
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="savePlan('${id||''}')">Save plan</button></div>`);
}
function setMode(m){ planMode=m;
  document.getElementById('m-elapsed').className=m==='elapsed'?'on':'';
  document.getElementById('m-paused').className=m==='paused'?'on':'';
  document.getElementById('modehint').textContent=MODE_TXT[m]; }
function savePlan(id){
  const g=x=>document.getElementById(x).value;
  if(!g('pn')){toast('Plan needs a name','err');return;}
  const d={name:g('pn'),price:+g('pp')||0,validity:g('pv'),down:+g('pd'),up:+g('pu'),
           data:g('pc')||null,devices:+g('pdev'),mode:planMode,status:'active'};
  if(id){Object.assign(PLANS.find(x=>x.id===id),d);toast('Plan updated','ok');}
  else {PLANS.push(Object.assign({id:'P-'+(PLANS.length+1),users:0,revenue:0},d));toast('Plan created','ok');}
  closeModal();render();
}
function retirePlan(id){ PLANS.find(x=>x.id===id).status='retired'; closeModal(); toast('Plan retired'); render(); }

/* ---- INTENTS ---- */
function intentTable(list){
  return `<div class="t-wrap"><table><thead><tr><th>Intent</th><th>Router</th><th>Action</th><th>State</th>
    <th>Priority</th><th class="right">Retries</th><th>Created</th><th>Exec</th><th></th></tr></thead><tbody>
    ${list.map(i=>{const st=INTENT_STATE[i.state],r=routerById(i.router);return `<tr>
      <td class="mono">${i.id}</td>
      <td><div class="t-name">${esc(r.name)}</div><div class="t-sub">${esc(custOfRouter(r).name)}</div></td>
      <td>${esc(i.action)}${i.err?`<div class="t-sub" style="color:${i.state==='waiting'?'var(--amber-dark)':'var(--danger-text)'}">${esc(i.err)}</div>`:''}</td>
      <td><span class="pill ${st.cls}"><i class="dot"></i>${st.label}</span></td>
      <td><span class="tiny ${i.priority==='high'?'':'muted'}">${i.priority}</span></td>
      <td class="right">${i.retries}</td><td class="t-sub">${agoTxt(i.created)}</td><td class="t-sub mono">${i.exec}</td>
      <td>${i.state==='failed'?`<button class="btn btn-sm" onclick="retryIntent('${i.id}')">Retry</button>`:
          i.state==='queued'?`<button class="btn btn-sm btn-ghost" onclick="cancelIntent('${i.id}')">Cancel</button>`:''}</td>
    </tr>`}).join('')}</tbody></table></div>`;
}
let iFilter='';
function vIntents(){
  const list=iFilter?INTENTS.filter(i=>i.state===iFilter):INTENTS;
  const counts=Object.keys(INTENT_STATE).map(k=>[k,INTENTS.filter(i=>i.state===k).length]);
  return `<div class="card"><div class="card-h"><h3>MT Intents</h3><span class="sub">every router change is queued here first</span></div>
    <div class="card-b" style="padding-bottom:0"><div class="gatebar" style="margin-bottom:14px">
      <b>Queued &#8594; Sent &#8594; Confirmed &#8594; Failed &#8594; Expired.</b>
      No screen sends a command directly to a router. Whether delivery is immediate or waits for the router to check in is <b>pending B1</b>.</div></div>
    <div class="filters">
      <button class="btn btn-sm ${!iFilter?'btn-primary':''}" onclick="iFilter='';render()">All (${INTENTS.length})</button>
      ${counts.filter(c=>c[1]).map(c=>`<button class="btn btn-sm ${iFilter===c[0]?'btn-primary':''}" onclick="iFilter='${c[0]}';render()">${INTENT_STATE[c[0]].label} (${c[1]})</button>`).join('')}
      <span class="fcount">${list.length} intent(s)</span></div>
    ${list.length?intentTable(list):`<div class="empty"><div class="ico">&#8644;</div><h4>Nothing queued</h4>
      <p>That is a good sign — every router is in its desired state.</p></div>`}</div>`;
}
function retryIntent(id){const i=INTENTS.find(x=>x.id===id);if(!i)return;i.state='queued';i.retries++;i.err=null;
  toast('Intent '+id+' re-queued — delivered when the router next checks in','ok');renderNav();render();}
function cancelIntent(id){const i=INTENTS.findIndex(x=>x.id===id);if(i<0)return;INTENTS.splice(i,1);
  toast('Intent '+id+' cancelled');renderNav();render();}
function queueIntent(rid,action){
  INTENTS.unshift({id:'IN-'+(4860+INTENTS.length),router:rid,action,state:'queued',created:0,priority:'normal',retries:0,err:null,exec:'—'});
  closeModal();toast(action+' queued for '+routerById(rid).name,'ok');renderNav();render();}

/* ---- SESSIONS ---- */
let sF={router:'',q:''};
function vSessions(){
  const list=SESSIONS.filter(s=>(!sF.router||s.router===sF.router)&&(!sF.q||(s.voucher+s.dev+s.ip+s.mac).toLowerCase().includes(sF.q.toLowerCase())));
  return `<div class="card"><div class="card-h"><h3>MT Sessions</h3><span class="sub">guests connected right now</span></div>
    <div class="card-b" style="padding-bottom:0">${gate('Live session data and disconnect depend on <b>Step 0</b> — RADIUS accounting from real hardware. Figures are mock.')}</div>
    <div class="filters">
      <input type="text" placeholder="Search voucher, device, IP, MAC..." value="${esc(sF.q)}" oninput="sF.q=this.value;render()">
      <select onchange="sF.router=this.value;render()"><option value="">All routers</option>
        ${ROUTERS.filter(r=>r.sessions>0).map(r=>`<option value="${r.id}" ${sF.router===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
      <span class="fcount">${list.length} active session(s)</span></div>
    ${list.length?`<div class="t-wrap"><table><thead><tr><th>Voucher</th><th>Device</th><th>Router</th><th>IP</th><th>MAC</th>
      <th>Plan</th><th>Duration</th><th class="right">Down</th><th class="right">Up</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(s=>`<tr><td class="mono t-name">${s.voucher}</td><td>${esc(s.dev)}</td>
        <td><div class="t-sub">${esc(routerById(s.router).name)}</div></td>
        <td class="mono t-sub">${s.ip}</td><td class="mono t-sub">${s.mac}</td><td>${planName(s.plan)}</td>
        <td>${Math.floor(s.start/60)}h ${s.start%60}m</td>
        <td class="right mono">${s.down} MB</td><td class="right mono">${s.up} MB</td>
        <td><span class="pill ${s.status==='online'?'p-ok':'p-mute'}"><i class="dot"></i>${s.status}</span></td>
        <td><button class="btn btn-sm btn-danger" onclick="modalDisconnect('${s.voucher}')">Disconnect</button></td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty"><div class="ico">&#9679;</div><h4>No active sessions</h4>
        <p>Nobody is connected right now. That is normal outside business hours.</p></div>`}</div>`;
}
function modalDisconnect(v){
  const s=SESSIONS.find(x=>x.voucher===v);
  openModal(`<div class="modal-h"><h3>Queue disconnect</h3><button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
  <div class="modal-b"><p>Disconnect voucher <b class="mono">${v}</b> on <b>${esc(routerById(s.router).name)}</b>?</p>
    <div class="mt16">${gate('This <b>queues an intent</b>. Whether it reaches the router immediately or at its next check-in is <b>pending B1</b>.')}</div>
    <div class="mt16 tiny muted">The guest keeps their remaining time — disconnecting ends the session, not the voucher.</div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="queueIntent('${s.router}','Disconnect session ${v}')">Queue disconnect</button></div>`);
}
</script>
<script>
/* ---- VOUCHERS ---- */
let vFilter={q:'',status:'',batch:'',page:1};
function vVouchers(){
  const dates=BATCHES.map(b=>b.created).sort();
  return `<div class="card"><div class="card-h"><h3>MT Vouchers</h3>
      <span class="sub">From ${dates[0]} to ${dates[dates.length-1]}</span><div class="grow"></div>
      <button class="btn btn-primary btn-sm" onclick="modalGenerate()">+ Generate</button></div>
    <div class="filters">
      <input type="text" placeholder="Search voucher code..." value="${esc(vFilter.q)}" oninput="vFilter.q=this.value;vFilter.page=1;paintVouchers()">
      <select onchange="vFilter.status=this.value;vFilter.page=1;paintVouchers()"><option value="">All statuses</option>
        ${Object.keys(VSTATE).map(k=>`<option value="${k}" ${vFilter.status===k?'selected':''}>${VSTATE[k].label}</option>`).join('')}</select>
      <select onchange="vFilter.batch=this.value;vFilter.page=1;paintVouchers()"><option value="">All batches</option>
        ${BATCHES.map(b=>`<option value="${b.id}" ${vFilter.batch===b.id?'selected':''}>${b.id}</option>`).join('')}</select>
      <span class="fcount" id="vcount"></span></div>
    <div id="voucherBody"></div></div>`;
}
afterRender.vouchers=paintVouchers;
function paintVouchers(){
  const q=vFilter.q.toLowerCase();
  const all=VOUCHERS.filter(v=>(!q||v.code.includes(q))&&(!vFilter.status||v.status===vFilter.status)&&(!vFilter.batch||v.batch===vFilter.batch));
  const per=12,pages=Math.max(1,Math.ceil(all.length/per));
  if(vFilter.page>pages)vFilter.page=pages;
  const rows=all.slice((vFilter.page-1)*per,vFilter.page*per);
  const c=$('#vcount');if(c)c.textContent=all.length+' voucher(s)';
  const host=$('#voucherBody');if(!host)return;
  if(!all.length){host.innerHTML=`<div class="empty"><div class="ico">&#9862;</div><h4>No vouchers match</h4>
    <p>Try a different code, status or batch.</p><button class="btn" onclick="vFilter={q:'',status:'',batch:'',page:1};render()">Clear filters</button></div>`;return;}
  host.innerHTML=`<div class="t-wrap"><table><thead><tr><th>Code</th><th>Plan</th><th class="right">Price</th><th class="right">Devices</th>
    <th>Batch</th><th>Status</th><th>Created</th><th>Activated</th><th>Expires</th><th></th></tr></thead><tbody>
    ${rows.map(v=>`<tr><td class="mono t-name" style="font-size:14px;letter-spacing:.5px">${v.code}</td>
      <td>${planName(v.plan)}</td><td class="right">${UGX(planPrice(v.plan))}</td>
      <td class="right t-sub">${planById(v.plan).devices>=99?'&#8734;':planById(v.plan).devices}</td>
      <td class="mono t-sub">${v.batch}</td>
      <td><span class="pill ${VSTATE[v.status].cls}"><i class="dot"></i>${VSTATE[v.status].label}</span></td>
      <td class="t-sub">${v.created}</td><td class="t-sub">${v.activated||'—'}</td><td class="t-sub">${v.expiry}</td>
      <td>${v.status==='unused'?`<button class="btn btn-sm btn-ghost" onclick="vSusp('${v.code}',1)">Suspend</button>`:
           v.status==='suspended'?`<button class="btn btn-sm btn-ghost" onclick="vSusp('${v.code}',0)">Restore</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    ${pages>1?`<div class="spread" style="padding:11px 16px;border-top:1px solid var(--line2)">
      <span class="tiny muted">Page ${vFilter.page} of ${pages}</span>
      <div class="row"><button class="btn btn-sm" ${vFilter.page<=1?'disabled':''} onclick="vFilter.page--;paintVouchers()">Previous</button>
      <button class="btn btn-sm" ${vFilter.page>=pages?'disabled':''} onclick="vFilter.page++;paintVouchers()">Next</button></div></div>`:''}`;
}
function vSusp(c,on){const v=VOUCHERS.find(x=>x.code===c);v.status=on?'suspended':'unused';
  toast('Voucher '+c+(on?' suspended':' restored'),on?'':'ok');paintVouchers();}

/* ---- BATCHES ---- */
function vBatches(){
  return `<div class="card"><div class="card-h"><h3>Voucher batches</h3><span class="sub">how vouchers are created and sold</span>
      <div class="grow"></div><button class="btn btn-primary btn-sm" onclick="modalGenerate()">+ Generate batch</button></div>
    <div class="card-b">
      <div class="tiny muted" style="margin-bottom:12px">
        <span style="display:inline-block;width:9px;height:9px;background:var(--gray);border-radius:2px"></span> unused
        &nbsp; <span style="display:inline-block;width:9px;height:9px;background:var(--green);border-radius:2px"></span> active now
        &nbsp; <span style="display:inline-block;width:9px;height:9px;background:var(--line);border-radius:2px"></span> expired</div>
      <div class="grid2">
    ${BATCHES.map(b=>{const sold=b.qty-b.unused,pct=Math.round(sold/b.qty*100),rev=sold*planPrice(b.plan),low=b.unused/b.qty<0.12;
      return `<div class="card" style="border-color:${low?'#f4dbb0':'var(--line)'}">
        <div class="card-h" style="${low?'background:var(--amber-light);border-bottom-color:#f4dbb0':''}">
          <h3 class="mono" style="font-size:14px">${b.id}</h3>${low?'<span class="pill p-warn"><i class="dot"></i>Low stock</span>':''}
          <div class="grow"></div><span class="tiny muted">${b.created}</span></div>
        <div class="card-b"><div class="spread"><div><b>${planName(b.plan)}</b> · ${UGX(planPrice(b.plan))}</div>
            <div class="tiny muted">${esc(routerById(b.router).name)}</div></div>
          <div class="mt10" style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--gray-light)">
            <div style="width:${b.unused/b.qty*100}%;background:var(--gray)"></div>
            <div style="width:${b.active/b.qty*100}%;background:var(--green)"></div>
            <div style="width:${b.expired/b.qty*100}%;background:var(--line)"></div></div>
          <div class="mt10 tiny" style="display:grid;grid-template-columns:1fr 1fr;gap:3px 12px">
            <span class="muted">Generated</span><b class="right">${b.qty}</b>
            <span class="muted">Unused</span><b class="right">${b.unused}</b>
            <span class="muted">Active now</span><b class="right" style="color:var(--green-mid)">${b.active}</b>
            <span class="muted">Expired</span><b class="right">${b.expired}</b>
            <span class="muted">Sold</span><b class="right">${sold} (${pct}%)</b>
            <span class="muted">Revenue</span><b class="right">${UGX(rev)}</b></div>
          <div class="mt10 tiny muted">Created by ${esc(b.by)}</div>
          <div class="mt10 row"><button class="btn btn-sm" onclick="modalPrint('${b.id}')">Print</button>
            <button class="btn btn-sm" onclick="vFilter={q:'',status:'',batch:'${b.id}',page:1};go('vouchers')">View vouchers</button></div>
        </div></div>`;}).join('')}
      </div></div></div>`;
}
function modalGenerate(){
  openModal(`<div class="modal-h"><h3>Generate vouchers</h3><button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
  <div class="modal-b">
    <div class="field"><label>MT Router</label><select id="gr">${ROUTERS.filter(r=>r.hotspot==='running').map(r=>`<option value="${r.id}">${esc(r.name)} — ${esc(custOfRouter(r).name)}</option>`).join('')}</select>
      <div class="hint">Vouchers are redeemable only on this customer's routers.</div></div>
    <div class="field"><label>Plan</label><select id="gp">${PLANS.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${esc(p.name)} — ${UGX(p.price)} · ${p.devices>=99?'unlimited':p.devices} device${p.devices>1&&p.devices<99?'s':''} · ${p.mode}</option>`).join('')}</select></div>
    <div class="f2"><div class="field"><label>Output</label><select id="go_"><option>Thermal printer</option><option>PDF A4</option><option>PDF A3</option><option>Digital / QR only</option></select></div>
      <div class="field"><label>Printer</label><select id="gpr"><option>MPT-II · 58 mm · Bluetooth</option><option>LAN Printer · 80 mm · 192.168.88.100</option></select></div></div>
    <div class="field"><label>Quantity</label><input id="gq" type="number" value="50" min="1" max="500"></div>
    <div class="tiny muted">Generation is server-side and does not contact the router. The router only learns of a voucher when a guest redeems it.</div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="doGenerate()">Generate &amp; print</button></div>`);
}
function doGenerate(){
  const qty=+document.getElementById('gq').value||0;
  if(qty<1){toast('Quantity must be at least 1','err');return;}
  const plan=document.getElementById('gp').value,router=document.getElementById('gr').value;
  const id='UG-2026-'+String(82+BATCHES.length).padStart(4,'0');
  BATCHES.unshift({id,plan,qty,unused:qty,active:0,expired:0,by:'B. Mehta',created:'2026-09-19',router});
  for(let i=0;i<Math.min(qty,26);i++)
    VOUCHERS.unshift({code:String(10000000+Math.floor(Math.random()*89999999)),batch:id,plan,status:'unused',created:'2026-09-19',activated:null,expiry:'—'});
  closeModal();toast(qty+' vouchers generated in batch '+id,'ok');go('batches');setTimeout(()=>modalPrint(id),400);
}
function modalPrint(bid){
  const b=BATCHES.find(x=>x.id===bid),vs=VOUCHERS.filter(v=>v.batch===bid).slice(0,8);
  openModal(`<div class="modal-h"><h3>Print preview — ${bid}</h3><div class="grow"></div>
      <button class="btn btn-sm" id="bt-thermal" onclick="switchPrint('thermal')">Thermal 58mm</button>
      <button class="btn btn-sm btn-primary" id="bt-a4" onclick="switchPrint('a4')">A4 sheet</button>
      <button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
    <div class="modal-b" id="printArea"></div>
    <div class="modal-f no-print"><button class="btn" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="window.print()">Print</button></div>`,true);
  window.__pb={b,vs};switchPrint('a4');
}
function switchPrint(mode){
  const {b,vs}=window.__pb,p=planById(b.plan);
  document.getElementById('bt-a4').className='btn btn-sm'+(mode==='a4'?' btn-primary':'');
  document.getElementById('bt-thermal').className='btn btn-sm'+(mode==='thermal'?' btn-primary':'');
  const host=document.getElementById('printArea');
  if(mode==='thermal'){host.innerHTML=`<div class="thermal"><b style="font-family:var(--display);font-size:15px">DISHNET WIFI</b><hr>
    ${esc(p.name)}<br>${UGX(p.price)}<hr><div style="font-size:17px;letter-spacing:2px;font-weight:600">${vs[0]?vs[0].code:'00000000'}</div><hr>
    <div class="qr" style="margin:7px auto"></div>${esc(p.validity)} · ${p.devices>=99?'unlimited':p.devices} device${p.devices>1&&p.devices<99?'s':''}<br>
    Support +256 700 000 000<hr><span style="font-size:9.5px">${b.id}</span></div>
    <div class="tiny muted mt16" style="text-align:center">One slip per guest · 58 mm roll</div>`;
  } else {host.innerHTML=`<div class="vgrid">${vs.map(v=>`<div class="vch"><div class="top">DISHNET WIFI</div>
    <div class="code">${v.code}</div><div class="qr"></div><div class="meta"><b>${esc(p.name)}</b><br>${UGX(p.price)}<br>
    ${esc(p.validity)}<br>${p.devices>=99?'unlimited':p.devices} device${p.devices>1&&p.devices<99?'s':''}<br>
    <span style="opacity:.6">${b.id}</span></div></div>`).join('')}</div>
    <div class="tiny muted mt16" style="text-align:center">Showing 8 of ${b.qty} · A4 fits 12 per sheet</div>`;}
}

/* ---- SALES (tiles removed — Overview owns the summary) ---- */
let salesF={op:'',method:'',q:''};
function vSales(){
  const list=SALES.filter(s=>(!salesF.op||s.op===salesF.op)&&(!salesF.method||s.method===salesF.method)&&
    (!salesF.q||(s.ref+s.voucher+s.agent).toLowerCase().includes(salesF.q.toLowerCase())));
  const total=list.reduce((a,s)=>a+s.amount,0);
  return `<div class="card"><div class="card-h"><h3>Voucher sales</h3><span class="sub">today</span><div class="grow"></div>
      <b style="font-family:var(--display);font-size:19px">${UGX(total)}</b>
      <span class="tiny muted">${list.length} sale(s)</span></div>
    <div class="filters">
      <input type="text" placeholder="Search reference, voucher, counter..." value="${esc(salesF.q)}" oninput="salesF.q=this.value;render()">
      <select onchange="salesF.op=this.value;render()"><option value="">All operators</option>
        ${[...new Set(SALES.map(s=>s.op))].map(o=>`<option ${salesF.op===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="salesF.method=this.value;render()"><option value="">All payment methods</option>
        ${[...new Set(SALES.map(s=>s.method))].map(m=>`<option ${salesF.method===m?'selected':''}>${m}</option>`).join('')}</select>
      ${(salesF.op||salesF.method||salesF.q)?`<span class="chip">filtered <button onclick="salesF={op:'',method:'',q:''};render()">&#10005;</button></span>`:''}</div>
    ${list.length?`<div class="t-wrap"><table><thead><tr><th>Reference</th><th>Time</th><th>Voucher</th><th>Plan</th>
      <th class="right">Amount</th><th>Operator</th><th>Counter / agent</th><th>Method</th></tr></thead><tbody>
      ${list.map(s=>`<tr><td class="mono t-name">${s.ref}</td><td class="t-sub">${s.when}</td><td class="mono">${s.voucher}</td>
        <td>${planName(s.plan)}</td><td class="right"><b>${UGX(s.amount)}</b></td><td>${esc(s.op)}</td><td>${esc(s.agent)}</td>
        <td><span class="pill ${s.method==='Cash'?'p-mute':'p-info'}"><i class="dot"></i>${s.method}</span></td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty"><div class="ico">&#9878;</div><h4>No sales match</h4>
        <p>Nothing recorded for these filters.</p><button class="btn" onclick="salesF={op:'',method:'',q:''};render()">Clear filters</button></div>`}</div>`;
}

/* ---- REPORTS (Router activity removed — the router list owns that) ---- */
let repF={from:'2026-09-01',to:'2026-09-19',op:'',plan:''};
function vReports(){
  const created=BATCHES.reduce((a,b)=>a+b.qty,0);
  const activated=BATCHES.reduce((a,b)=>a+b.active+b.expired,0);
  const completed=BATCHES.reduce((a,b)=>a+b.expired,0);
  const revenue=BATCHES.reduce((a,b)=>a+(b.qty-b.unused)*planPrice(b.plan),0);
  const max=created||1;
  return `<div class="card"><div class="card-h"><h3>Reports</h3><span class="sub">revenue is recognised on activation, not on generation</span></div>
    <div class="filters">
      <input type="date" value="${repF.from}" onchange="repF.from=this.value;render()">
      <span class="tiny muted">to</span><input type="date" value="${repF.to}" onchange="repF.to=this.value;render()">
      <select onchange="repF.op=this.value;render()"><option value="">All operators</option>
        ${[...new Set(SALES.map(s=>s.op))].map(o=>`<option ${repF.op===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="repF.plan=this.value;render()"><option value="">All plans</option>
        ${PLANS.map(p=>`<option value="${p.id}" ${repF.plan===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      ${(repF.op||repF.plan)?`<span class="chip">filtered <button onclick="repF.op='';repF.plan='';render()">&#10005;</button></span>`:''}</div>
    ${[['Vouchers created',created],['Vouchers activated',activated],['Sessions completed',completed]].map(f=>
      `<div class="funnel-row"><span class="grow">${f[0]}</span>
        <div style="width:170px"><div class="funnel-bar" style="width:${Math.round(f[1]/max*100)}%"></div></div>
        <b style="width:58px;text-align:right">${f[1]}</b></div>`).join('')}
    <div class="funnel-row total"><span class="grow">Revenue from activated vouchers</span><b>${UGX(revenue)}</b></div></div>
  <div class="grid2 mt16">
    <div class="card"><div class="card-h"><h3>Plan performance</h3></div><div class="t-wrap"><table>
      <thead><tr><th>Plan</th><th>Mode</th><th class="right">Users</th><th class="right">Revenue</th><th style="width:80px">Share</th></tr></thead><tbody>
      ${PLANS.filter(p=>p.revenue).sort((a,b)=>b.revenue-a.revenue).map(p=>{const tot=PLANS.reduce((a,x)=>a+x.revenue,0);
        return `<tr><td class="t-name">${esc(p.name)}</td><td class="t-sub">${p.mode}</td><td class="right">${p.users}</td>
        <td class="right">${UGX(p.revenue)}</td><td><div style="background:var(--gray-light);height:7px;border-radius:4px">
        <div style="width:${Math.round(p.revenue/tot*100)}%;background:var(--red);height:7px;border-radius:4px"></div></div></td></tr>`;}).join('')}
      </tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>Operator performance</h3></div><div class="t-wrap"><table>
      <thead><tr><th>Operator</th><th class="right">Sales</th><th class="right">Revenue</th></tr></thead><tbody>
      ${[...new Set(SALES.map(s=>s.op))].map(o=>{const rows=SALES.filter(s=>s.op===o);
        return `<tr><td class="t-name">${esc(o)}</td><td class="right">${rows.length}</td><td class="right">${UGX(rows.reduce((a,s)=>a+s.amount,0))}</td></tr>`;}).join('')}
      </tbody></table></div></div></div>`;
}

/* ---- USERS / AUDIT / SETTINGS ---- */
function vUsers(){
  const yn=v=>v===1?'<span style="color:var(--green-mid)">&#10003;</span>':v===0?'<span class="muted">&#8212;</span>':`<span class="tiny" style="color:var(--amber-dark)">${v}</span>`;
  return `<div class="card"><div class="card-h"><h3>Users</h3><div class="grow"></div>
      <button class="btn btn-primary btn-sm" onclick="toast('User invite is mocked in this prototype')">+ Invite user</button></div>
    <div class="t-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Customer scope</th><th>Last active</th><th>Status</th></tr></thead><tbody>
    ${USERS.map(u=>`<tr><td class="t-name">${esc(u.name)}</td><td class="t-sub">${esc(u.email)}</td>
      <td><span class="pill ${u.role==='Super Admin'?'p-info':u.role==='Reseller'?'p-warn':'p-mute'}"><i class="dot"></i>${u.role}</span></td>
      <td>${esc(u.cust)}</td><td class="t-sub">${u.last}</td>
      <td><span class="pill ${u.status==='active'?'p-ok':'p-bad'}"><i class="dot"></i>${u.status}</span></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card mt16"><div class="card-h"><h3>Role permissions</h3><span class="sub">Reseller is a role of a customer, not a separate entity</span></div>
    <div class="t-wrap"><table><thead><tr><th>Capability</th><th style="text-align:center">Super Admin</th>
      <th style="text-align:center">Operations</th><th style="text-align:center">Reseller</th></tr></thead><tbody>
      ${ROLE_MATRIX.map(r=>`<tr><td>${r[0]}</td><td style="text-align:center">${yn(r[1])}</td>
        <td style="text-align:center">${yn(r[2])}</td><td style="text-align:center">${yn(r[3])}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--line2)"><span class="tiny muted">
      "own" = limited to that user's assigned customer. Backend isolation is out of scope in this prototype.</span></div></div>`;
}
function vAudit(){
  return `<div class="card"><div class="card-h"><h3>Audit log</h3><span class="sub">append-only · every privileged action</span></div>
    <div class="t-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Result</th></tr></thead><tbody>
    ${AUDIT.map(a=>`<tr><td class="mono t-sub">${a.when}</td><td>${esc(a.who)}</td><td class="t-name">${esc(a.what)}</td>
      <td class="t-sub">${esc(a.target)}</td><td><span class="pill ${a.ok?'p-ok':'p-bad'}"><i class="dot"></i>${a.ok?'OK':'Failed'}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--line2)"><span class="tiny muted">
      Records are never edited or deleted. Every router change goes through an intent, so nothing bypasses this log.</span></div></div>`;
}
function vSettings(){
  return `<div class="grid2">
    <div class="card"><div class="card-h"><h3>Captive portal</h3><span class="sub">what a guest sees</span></div>
      <div class="card-b"><p class="tiny muted" style="margin-bottom:12px">Edited here, then published to a router from its <b>HotSpot</b> tab.</p>
      <button class="btn btn-primary" onclick="modalPortal()">Open portal editor</button></div></div>
    <div class="card"><div class="card-h"><h3>Printers</h3><span class="sub">voucher output devices</span></div>
      <div class="t-wrap"><table><thead><tr><th>Printer</th><th>Width</th><th>Connection</th></tr></thead><tbody>
        <tr><td class="t-name">MPT-II</td><td>58 mm</td><td class="t-sub">Bluetooth</td></tr>
        <tr><td class="t-name">LAN Printer</td><td>80 mm</td><td class="t-sub mono">192.168.88.100</td></tr>
      </tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>Gateway</h3></div><div class="card-b"><dl class="dl">
      <dt>WireGuard network</dt><dd class="mono">10.66.0.0/24</dd>
      <dt>Listen port</dt><dd class="mono">UDP 51820</dd>
      <dt>RADIUS</dt><dd class="mono">10.66.0.1:1812 / 1813</dd></dl>
      <div class="mt16">${gate('Delivery model (server-initiated vs router-initiated) is <b>pending B1</b>. No screen assumes either.')}</div></div></div>
  </div>`;
}
function modalPortal(rid){
  openModal(`<div class="modal-h"><h3>Captive portal${rid?' — '+esc(routerById(rid).name):''}</h3>
      <button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
  <div class="modal-b"><div class="grid2">
    <div><div class="field"><label>Portal title</label><input value="${esc(PORTAL.title)}" oninput="PORTAL.title=this.value;paintPP()"></div>
      <div class="field"><label>Welcome message</label><textarea rows="2" oninput="PORTAL.welcome=this.value;paintPP()">${esc(PORTAL.welcome)}</textarea></div>
      <div class="f2"><div class="field"><label>Brand colour</label><input type="color" value="${PORTAL.colour}" oninput="PORTAL.colour=this.value;paintPP()"></div>
        <div class="field"><label>Background</label><input type="color" value="${PORTAL.bg}" oninput="PORTAL.bg=this.value;paintPP()"></div></div>
      <div class="field"><label>Support contact</label><input value="${esc(PORTAL.support)}" oninput="PORTAL.support=this.value;paintPP()"></div>
      <div class="field"><label>Terms line</label><input value="${esc(PORTAL.terms)}" oninput="PORTAL.terms=this.value;paintPP()"></div>
      ${gate('Publishing depends on <b>Step 0</b> (HotSpot configuration on real hardware).')}</div>
    <div><div class="tiny muted" style="margin-bottom:8px">Live preview</div><div id="ppHost"></div></div>
  </div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Close</button>
    <button class="btn btn-primary" onclick="publishPortal(${rid?`'${rid}'`:'null'})">Queue publish</button></div>`,true);
  paintPP();
}
function paintPP(){
  const h=$('#ppHost');if(!h)return;
  h.innerHTML=`<div class="pp-frame"><div class="pp-body" style="background:${PORTAL.bg}">
    <div class="pp-logo" style="background:${PORTAL.colour}">${esc(PORTAL.logo||'D')}</div>
    <div style="font-family:var(--display);font-size:20px;font-weight:600">${esc(PORTAL.title)}</div>
    <div class="tiny muted" style="margin:7px 0 15px">${esc(PORTAL.welcome)}</div>
    <input class="pp-in" placeholder="Voucher code" readonly>
    <div class="pp-btn" style="background:${PORTAL.colour}">Connect</div><div class="grow"></div>
    <div class="tiny muted" style="margin-top:18px">${esc(PORTAL.terms)}<br><b>${esc(PORTAL.support)}</b></div></div></div>`;
}
function publishPortal(rid){
  const targets=rid?[rid]:ROUTERS.filter(r=>r.hotspot==='running').map(r=>r.id);
  targets.forEach(id=>INTENTS.unshift({id:'IN-'+(4870+INTENTS.length),router:id,action:'Update captive portal',
    state:'queued',created:0,priority:'normal',retries:0,err:null,exec:'—'}));
  closeModal();toast('Portal publish queued for '+targets.length+' router'+(targets.length>1?'s':''),'ok');renderNav();render();
}

/* ---- MODALS ---- */
function modalAddRouter(){
  openModal(`<div class="modal-h"><h3>Register MikroTik router</h3><button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
  <div class="modal-b">
    <div class="f2"><div class="field"><label>Router name</label><input id="nrn" placeholder="KLA-Riverside-04"></div>
      <div class="field"><label>Serial number</label><input id="nrs" placeholder="HDX0000X0XX"></div></div>
    <div class="field"><label>Site</label><select id="nrsite">
      ${CUSTOMERS.map(c=>`<optgroup label="${esc(c.name)}">${SITES.filter(s=>s.cust===c.id).map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.loc)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div class="field"><label>Model</label><select id="nrm">${[...new Set(ROUTERS.map(r=>r.model))].map(m=>`<option>${m}</option>`).join('')}</select></div>
    <div class="mt16">${gate('Registering allocates a WireGuard identity and tunnel IP. The router is <b>not contacted</b> — it stays <b>Never connected</b> until it reaches the gateway.')}</div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="doAddRouter()">Register router</button></div>`);
}
function doAddRouter(){
  const g=x=>document.getElementById(x).value;
  if(!g('nrn')){toast('Router needs a name','err');return;}
  const n=ROUTERS.length+1,id='MT-'+String(n).padStart(4,'0');
  ROUTERS.push({id,name:g('nrn'),site:g('nrsite'),model:g('nrm'),serial:g('nrs')||'—',ros:'—',
    conn:'never',wg:'never',wgIp:'10.66.0.'+(10+n),endpoint:'—',hs:null,latency:null,uptime:'—',seen:null,
    prov:'registered',hotspot:'none',sessions:0,profile:'—',lastOk:null,lastErr:null,
    desired:{ros:'7.16.2',profile:'dn-standard',plans:'1H,1D',portal:'v4',bw:'10/3'},
    actual:{ros:'—',profile:'—',plans:'—',portal:'—',bw:'—'}});
  closeModal();toast(id+' registered — shown as Never connected until it reaches the gateway','ok');
  rF.cohort='never';renderNav();go('routers');
}
function modalRouterActions(id){
  const r=routerById(id);
  const acts=[['Sync configuration','Sync configuration'],['Re-provision from scratch','Provision WireGuard'],
    ['Configure RADIUS','Configure RADIUS'],['Update captive portal','Update captive portal'],
    ['Update bandwidth profile','Update bandwidth profile']];
  openModal(`<div class="modal-h"><h3>${esc(r.name)}</h3><button class="btn btn-sm btn-ghost" onclick="closeModal()">&#10005;</button></div>
  <div class="modal-b"><div class="tiny muted" style="margin-bottom:12px">Every action below <b>queues an intent</b>. Nothing is sent to the router from this dialog.</div>
    ${acts.map(a=>`<button class="btn mt10" style="width:100%;justify-content:flex-start" onclick="queueIntent('${id}','${a[1]}')">${a[0]}</button>`).join('')}
    <div class="mt16">${gate('<b>Restart</b>, <b>reset</b> and <b>disable HotSpot</b> are deliberately absent. docs/32 §0.4 must prove reset and restore on the bench first.')}</div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
renderNav();render();
setTimeout(()=>toast('Prototype V2 — mock data. No router, RADIUS or WireGuard endpoint is contacted.'),600);
</script>
