# Drop into /etc/easypanel/traefik/config/ on the APP droplet (same proven
# mechanism as uisp.yaml). Serves webmail.dishnetuganda.com with a Let's
# Encrypt certificate, proxying to Roundcube on the mail droplet's :8081
# (which the DO firewall opens to the app droplet only).
#
# REPLACE MAIL_DROPLET_IP before deploying.
http:
  routers:
    webmail:
      rule: "Host(`webmail.dishnetuganda.com`)"
      entryPoints: ["https"]
      priority: 10
      service: webmail
      tls:
        certResolver: letsencrypt
  services:
    webmail:
      loadBalancer:
        servers:
          - url: "http://MAIL_DROPLET_IP:8081"
